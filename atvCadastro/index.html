<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Projeto</title>
</head>
<body>
    <div class="flexbox">
        <header>
            <center><h1>CONTROLE DE NOTAS</h1></center>
        </header>
        <br>

        <div id="fundo">
            <div>
                <center><h2>CADASTRAR ALUNOS</h2></center>
                <div>
                    <input type="text" id="nome" placeholder="Digite o nome do aluno aqui">
                    <input type="text" id="sobrenome" placeholder="Digite o sobrenome do aluno aqui">
                    <input type="number" id="nota1" placeholder="Digite a primeira nota aqui">
                    <input type="number" id="nota2" placeholder="Digite a segunda nota aqui">
                    <input type="number" id="nota3" placeholder="Digite a terceira nota aqui">
                </div>
            </div>
            <br><br>

            <div>
                <button id="adicionar">Adicionar</button>
            </div>

            <br>

            <footer>
                <center><h2>Lista de alunos:</h2></center>
                <div id="lista">
                    <div id="aviso"></div>
                 <div id="resultado"></div>
               </div>  
            </footer>

            <br><br>
        </div>
    </div>
</body>
</html>
